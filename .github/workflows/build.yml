name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Check Python version and cgi
        run: |
          python3 --version
          python3 -c "import cgi; print('cgi OK:', cgi.__file__)"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            automake autopoint gettext python3-pip python3-setuptools

      - name: Install Buildozer and tools
        run: |
          pip3 install --upgrade pip setuptools wheel
          pip3 install buildozer==1.5.0 cython==0.29.36

      - name: Build APK
        run: |
          yes | buildozer -v android debug 2>&1 | tail -200

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kashif-bot-apk
          path: bin/*.apk
          if-no-files-found: warn
